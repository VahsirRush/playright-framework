# Runs the full Playwright suite on every push and pull request.
name: Playwright Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Playwright (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Runs all three browser projects. Any failing test gives a non-zero exit code,
      # which fails the job.
      - name: Run Playwright tests
        run: npx playwright test

      # Runs even when tests fail (but not when the run is cancelled), so failures still
      # come with a report.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
